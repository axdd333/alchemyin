<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemyin: House of Wisdom</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="noise-overlay"></div>

    <header class="header-layer">
        <h1 class="brand-mark">Alchemyin</h1>
        <p class="brand-sub">House of Wisdom</p>
    </header>

    <main class="viewport">
        <canvas id="artifact-canvas"></canvas>
    </main>

    <nav class="nav-layer">
        <ul class="nav-links">
            <li><a href="#philosophy" class="link" data-text="Philosophy">Philosophy</a></li>
            <li><a href="#systems" class="link" data-text="Systems">Systems</a></li>
            <li><a href="#artifacts" class="link" data-text="Artifacts">Artifacts</a></li>
            <li><a href="#oracle" class="link" data-text="Oracle">Oracle</a></li>
        </ul>
    </nav>

    <script src="scripts.js"></script>
    <!-- Hero / sanctum -->
<section class="hero">
  <canvas id="wisdom-field" aria-hidden="true"></canvas>

  <div class="hero-inner">
    <div class="temple-mark" aria-hidden="true">
      <span class="arch"></span>
      <span class="pillars"></span>
    </div>

    <h1 class="hero-title">Stepping into a house of wisdom</h1>
    <p class="hero-subtitle">
      A quiet studio for philosophy, systems, artifacts, and the oracle.
    </p>
  </div>
</section>

</body>
</html>
