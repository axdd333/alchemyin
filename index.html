<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy · So the Model Holds</title>
    <meta name="description" content="Alchemy – a systems institute for models that survive contact with reality. A quiet operating surface for tools, infrastructure, and artifacts built so the model holds.">

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-root" data-state="idle">
        <!-- Void viewport -->
        <div class="viewport">
            <canvas id="artifact-canvas" aria-hidden="true"></canvas>
            <div class="noise-overlay" aria-hidden="true"></div>
        </div>

        <!-- Radial field hint -->
        <div class="field-halo" aria-hidden="true"></div>

        <!-- Header / Brand lockup -->
        <header class="header-layer" data-layer="header">
            <div class="header-inner">
                <div class="brand-mark">
                    <span class="brand-wordmark">Alchemy</span>
                    <span class="brand-subtitle">SO THE MODEL HOLDS</span>
                </div>
            </div>
        </header>

        <!-- Grid + card plane -->
        <main class="grid-plane" data-layer="content">
            <!-- Chamber rail -->
            <section class="chamber-rail" aria-label="Chambers">
                <button
                    class="chamber-chip"
                    data-chamber="philosophy"
                    aria-pressed="false"
                    type="button"
                >
                    <span class="chamber-chip__label">Chamber I</span>
                    <span class="chamber-chip__title">Philosophy</span>
                </button>

                <button
                    class="chamber-chip"
                    data-chamber="systems"
                    aria-pressed="false"
                    type="button"
                >
                    <span class="chamber-chip__label">Chamber II</span>
                    <span class="chamber-chip__title">Systems</span>
                </button>

                <button
                    class="chamber-chip"
                    data-chamber="artifacts"
                    aria-pressed="false"
                    type="button"
                >
                    <span class="chamber-chip__label">Chamber III</span>
                    <span class="chamber-chip__title">Artifacts</span>
                </button>

                <button
                    class="chamber-chip"
                    data-chamber="oracle"
                    aria-pressed="false"
                    type="button"
                >
                    <span class="chamber-chip__label">Chamber IV</span>
                    <span class="chamber-chip__title">Oracle</span>
                </button>
            </section>

            <!-- Chamber content panel -->
            <section
                class="chamber-panel"
                data-layer="chamber-panel"
                aria-hidden="true"
                aria-live="polite"
            >
                <button class="chamber-panel__scrim" type="button" data-action="close-chamber" aria-label="Close chamber"></button>
                <article class="chamber-surface" role="dialog" aria-modal="true">
                    <header class="chamber-header">
                        <div class="chamber-kicker">
                            <span class="chamber-kicker__label" data-chamber-label></span>
                            <span class="chamber-kicker__dot">·</span>
                            <span class="chamber-kicker__name" data-chamber-name></span>
                        </div>
                        <button
                            class="chamber-close"
                            type="button"
                            data-action="close-chamber"
                            aria-label="Close"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                        <h1 class="chamber-title" data-chamber-title></h1>
                    </header>

                    <div class="chamber-body" data-chamber-body>
                        <!-- Injected copy -->
                    </div>

                    <footer class="chamber-footer">
                        <button
                            class="depth-link"
                            type="button"
                            data-action="open-depth"
                        >
                            <span class="depth-link__label">Descend into details</span>
                        </button>
                    </footer>
                </article>
            </section>

            <!-- Depth document view -->
            <section
                class="depth-view"
                data-layer="depth"
                aria-hidden="true"
                aria-live="polite"
            >
                <button class="depth-view__scrim" type="button" data-action="close-depth" aria-label="Close document"></button>
                <article class="depth-surface" role="dialog" aria-modal="true">
                    <header class="depth-header">
                        <div class="depth-kicker">
                            <span class="depth-kicker__label">Document</span>
                            <span class="depth-kicker__dot">·</span>
                            <span class="depth-kicker__chamber" data-depth-chamber></span>
                        </div>
                        <button
                            class="depth-close"
                            type="button"
                            data-action="close-depth"
                            aria-label="Close"
                        >
                            <span aria-hidden="true">×</span>
                        </button>
                        <h1 class="depth-title" data-depth-title></h1>
                    </header>

                    <div class="depth-body" data-depth-body>
                        <!-- Injected document content -->
                    </div>
                </article>
            </section>
        </main>

        <!-- Lower navigation -->
        <nav class="primary-nav" aria-label="Primary">
            <ul class="nav-links" role="list">
                <li>
                    <a href="#philosophy"
                       class="link"
                       data-nav-target="philosophy"
                       data-chamber="philosophy"
                    >
                        <span class="link__text">Philosophy</span>
                    </a>
                </li>
                <li>
                    <a href="#systems"
                       class="link link--active"
                       data-nav-target="systems"
                       data-chamber="systems"
                    >
                        <span class="link__text">Systems</span>
                    </a>
                </li>
                <li>
                    <a href="#artifacts"
                       class="link"
                       data-nav-target="artifacts"
                       data-chamber="artifacts"
                    >
                        <span class="link__text">Artifacts</span>
                    </a>
                </li>
                <li>
                    <a href="#oracle"
                       class="link"
                       data-nav-target="oracle"
                       data-chamber="oracle"
                    >
                        <span class="link__text">Oracle</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Loading state for Three.js -->
        <div class="loading-state" aria-live="polite" aria-atomic="true">
            <div class="loading-state__spinner" aria-hidden="true"></div>
        </div>
    </div>

    <script src="scripts.js" type="module"></script>
</body>
</html>
