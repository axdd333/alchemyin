<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House of Wisdom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-canvas" aria-hidden="true">
      <canvas id="mesh"></canvas>
    </div>

    <header class="top-nav">
      <div class="nav-inner">
        <div class="logo-mark" aria-label="House of Wisdom mark">
          <span class="pill"></span>
          <span class="gate"></span>
        </div>
        <nav class="nav-links">
          <a href="#about">About</a>
          <a href="#projects">Projects</a>
          <a href="#contact">Contact</a>
          <a class="muted" href="#signin">Sign In</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="about">
        <div class="hero-grid">
          <div class="hero-mark reveal">
            <div class="arch">
              <div class="arch-inner"></div>
              <div class="arch-mark" aria-hidden="true">
                <svg viewBox="0 0 120 120" role="presentation">
                  <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
                    <path d="M24 64c0-18 12-32 36-32s36 14 36 32" />
                    <path d="M20 64h80" />
                    <path d="M44 64v28" />
                    <path d="M76 64v28" />
                  </g>
                </svg>
              </div>
            </div>
          </div>
          <div class="hero-copy reveal">
            <p class="eyebrow">A calm, scholarly studio</p>
            <h1>House of Wisdom</h1>
            <p class="lede">A restrained space for systems, instruments, and deliberate code — light, exact, and enduring.</p>
            <a class="link-button" href="#projects">Learn more</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <p>© 2024 House of Wisdom Studio</p>
    </footer>

    <script src="scripts.js"></script>
  </body>
</html>
