<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy: So the model holds</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    >

    <!-- Three.js for the artifact -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Grain / noise -->
    <div class="noise-overlay"></div>

    <!-- Top inscription -->
    <header class="header-layer">
        <h1 class="brand-mark">Alchemyin</h1>
        <p class="brand-sub">House of Wisdom</p>
    </header>

    <!-- Void + artifact -->
    <main class="viewport">
        <canvas id="artifact-canvas"></canvas>

        <!-- Chamber panel (hidden by default) -->
        <section id="chamber-panel" class="chamber-panel chamber-panel--hidden" aria-hidden="true">
            <div class="chamber-surface">
                <button class="chamber-close" type="button" aria-label="Close">
                    &times;
                </button>
                <p class="chamber-label"></p>
                <h2 class="chamber-title"></h2>
                <div class="chamber-body"></div>
            </div>
        </section>
    </main>

    <!-- Bottom nav (four rooms) -->
    <nav class="nav-layer">
        <ul class="nav-links">
            <li><a href="#philosophy" class="link" data-chamber="philosophy">Philosophy</a></li>
            <li><a href="#systems" class="link" data-chamber="systems">Systems</a></li>
            <li><a href="#artifacts" class="link" data-chamber="artifacts">Artifacts</a></li>
            <li><a href="#oracle" class="link" data-chamber="oracle">Oracle</a></li>
        </ul>
    </nav>

    <script src="scripts.js"></script>
</body>
</html>
