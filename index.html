<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >
    <title>Alchemy · So the Model Holds</title>
    <meta
      name="description"
      content="Alchemy – a systems institute for tools, infrastructure, and artifacts built so the model holds."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    >

    <!-- Core 3D engine -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Atmospheric grain -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Central vertical axis (structural, almost invisible) -->
    <div class="axis-line" aria-hidden="true"></div>

    <!-- Top inscription / institutional header -->
    <header class="header-layer" role="banner">
        <div class="header-inner">
            <h1 class="brand-mark">Alchemy</h1>
            <p class="brand-sub">So the Model Holds</p>
        </div>
    </header>

    <!-- Void and all interactive surfaces -->
    <main class="viewport" id="core-environment" aria-label="Alchemy core environment">
        <canvas
          id="artifact-canvas"
          aria-hidden="true"
        ></canvas>

        <!-- Chamber panel (section-level briefing) -->
        <section
          id="chamber-panel"
          class="chamber-panel chamber-panel--hidden"
          aria-hidden="true"
          role="dialog"
          aria-modal="true"
          aria-labelledby="chamber-title"
        >
            <article class="chamber-surface">
                <button
                  class="chamber-close"
                  type="button"
                  aria-label="Close chamber"
                >
                    &times;
                </button>

                <header class="chamber-header">
                    <p class="chamber-label"></p>
                    <h2 class="chamber-title" id="chamber-title"></h2>
                </header>

                <div class="chamber-body"></div>
            </article>
        </section>

        <!-- Depth view / archive (long-form documents, initially unused) -->
        <section
          id="depth-view"
          class="depth-view depth-view--hidden"
          aria-hidden="true"
          role="dialog"
          aria-modal="true"
          aria-labelledby="depth-title"
        >
            <article class="depth-surface">
                <button
                  class="depth-close"
                  type="button"
                  aria-label="Close document"
                >
                    &times;
                </button>

                <header class="depth-header">
                    <p class="depth-kicker"></p>
                    <h2 class="depth-title" id="depth-title"></h2>
                    <p class="depth-subtitle"></p>
                </header>

                <div class="depth-body"></div>
            </article>
        </section>
    </main>

    <!-- Bottom navigation: four operations / divisions -->
    <nav class="nav-layer" aria-label="Primary">
        <ul class="nav-links">
            <li>
                <a
                  href="#philosophy"
                  class="link"
                  data-chamber="philosophy"
                  data-route="philosophy"
                >Philosophy</a>
            </li>
            <li>
                <a
                  href="#systems"
                  class="link"
                  data-chamber="systems"
                  data-route="systems"
                >Systems</a>
            </li>
            <li>
                <a
                  href="#artifacts"
                  class="link"
                  data-chamber="artifacts"
                  data-route="artifacts"
                >Artifacts</a>
            </li>
            <li>
                <a
                  href="#oracle"
                  class="link"
                  data-chamber="oracle"
                  data-route="oracle"
                >Oracle</a>
            </li>
        </ul>
    </nav>

    <script src="scripts.js"></script>
</body>
</html>
