<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Scholars collaborating around astronomical instruments</title>
  <desc id="desc">Hand-drawn style illustration with scholars, astrolabes, globes, tree branches, and blue mosaic tiles.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe3" />
      <stop offset="100%" stop-color="#e4dccf" />
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="mosaic" viewBox="0 0 120 120" width="12%" height="12%" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#d9edf6" />
      <path d="M0 60h120M60 0v120" stroke="#8bbcd5" stroke-width="8" opacity="0.7" />
      <path d="M0 0l120 120M120 0L0 120" stroke="#0f5a7a" stroke-width="6" opacity="0.45" />
    </pattern>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
    </filter>
  </defs>
